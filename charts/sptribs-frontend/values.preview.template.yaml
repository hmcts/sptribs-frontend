nodejs:
  # Don't modify below here
  image: ${IMAGE_NAME}
  ingressHost: ${SERVICE_FQDN}
  environment:
    CCD_API_URL: 'https://ccd-data-store-api-sptribs-case-api-pr-2703.preview.platform.hmcts.net'
    CASE_DOCUMENT_API_URL: 'https://ccd-case-document-am-api-sptribs-case-api-pr-2703.preview.platform.hmcts.net'
    SPTRIBS_CASE_API_URL: 'https://sptribs-case-api-pr-2703.preview.platform.hmcts.net'
    RATE_LIMITER_DISABLED: true
  keyVaults:
    sptribs:
      secrets:
        - name: app-insights-connection-string-preview
          alias: app-insights-connection-string
        - idam-ui-secret
        - idam-systemupdate-username
        - idam-systemupdate-password
        - redis-access-key
        - s2s-case-api-secret
        - postcode-lookup-token
        - specialTribunals-cic-pcq-token
        - sptribs-frontend-dynatrace-url
